# The way this works is the following:
#
# The create-release job runs purely to initialize the GitHub release itself
# and to output upload_url for the following job.
#
# The build-release job runs only once create-release is finished. It gets the
# release upload URL from create-release job outputs, then builds the release
# executables for each supported platform and attaches them as release assets
# to the previously created release.
#
# The key here is that we create the release only once.
#
# Reference:
# https://eugene-babichenko.github.io/blog/2020/05/09/github-actions-cross-platform-auto-releases/
# https://github.com/crate-ci/cargo-release/blob/91549dbf9db9915ba5f121890ad0816c7d851679/.github/workflows/post-release.yml

name: release
on:
  push:
    tags:
    - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version"
        required: true
        default: ""
      create_release:
        description: "Create release"
        required: true
        default: "true"
      upload_artifacts:
        description: "Upload artifacts"
        required: true
        default: "true"
      upload_url:
        description: "Upload URL of an existing release, when create_release is false"
        required: false
        default: ""

env:
  BIN_NAME: sendme
  IROH_FORCE_STAGING_RELAYS: "1"

# Default to read-only; jobs that need more grant it explicitly.
permissions:
  contents: read

jobs:
  create-release:
    permissions:
      contents: write        # drafts the GitHub release
    name: create-release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.release.outputs.upload_url }}
      release_version: ${{ env.RELEASE_VERSION }}
    steps:
    - name: Get the release version from the tag (push)
      shell: bash
      if: env.RELEASE_VERSION == '' && github.event_name == 'push'
      run: |
        # See: https://github.community/t5/GitHub-Actions/How-to-get-just-the-tag-name/m-p/32167/highlight/true#M1027
        version="${GITHUB_REF#refs/tags/}"
        echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
        echo "version is: $version"
    - name: Get the release version from the tag (dispatch)
      shell: bash
      if: github.event_name == 'workflow_dispatch'
      env:
        INPUT_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
      run: |
        echo "RELEASE_VERSION=$INPUT_RELEASE_VERSION" >> "$GITHUB_ENV"
        echo "version is: $INPUT_RELEASE_VERSION"
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 1
    - name: Create GitHub release
      id: release
      if: github.event.inputs.create_release == 'true' || github.event_name == 'push'
      uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        tag_name: ${{ env.RELEASE_VERSION }}
        release_name: ${{ env.RELEASE_VERSION }}
  build-release:
    permissions:
      contents: write        # uploads the release archives
    name: build-release
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        name: [ubuntu-latest, ubuntu-arm-latest, macOS-arm-latest, macOS-latest, windows-latest]
        rust: [stable]
        include:
          - name: ubuntu-arm-latest
            os: ubuntu-latest
            target: linux-aarch64
            cargo_targets: "aarch64-unknown-linux-musl"
            runner: [self-hosted, linux, ARM64]
          - name: ubuntu-latest
            os: ubuntu-latest
            target: linux-x86_64
            cargo_targets: "x86_64-unknown-linux-musl"
            runner: [self-hosted, linux, X64]
          - name: macOS-latest
            os: macOS-latest
            target: darwin-x86_64
            cargo_targets: "x86_64-apple-darwin"
            runner: [self-hosted, macOS, ARM64]
          - name: macOS-arm-latest
            os: macOS-latest
            target: darwin-aarch64
            cargo_targets: "aarch64-apple-darwin"
            runner: [self-hosted, macOS, ARM64]
        # TODO: windows runner is not available on the org level
          - name: windows-latest
            os: windows-latest
            target: windows-x86_64
            cargo_targets: "x86_64-pc-windows-msvc"
            runner: [windows-latest]
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 1
    - name: Install Rust
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
      with:
        toolchain: ${{ matrix.rust }}
        targets: ${{ matrix.cargo_targets }}
    - name: Ensure musl support
      if: ${{ contains(matrix.cargo_targets, '-musl') }}
      run: sudo apt-get install musl-tools -y
    - name: Build release binary
      shell: bash
      env:
        MATRIX_NAME: ${{ matrix.name }}
        CARGO_TARGET: ${{ matrix.cargo_targets }}
      run: |
        if [ "$MATRIX_NAME" = "ubuntu-arm-latest" ]; then
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
          export CC=aarch64-linux-gnu-gcc
        fi
        cargo build --locked --verbose --release --target "$CARGO_TARGET"
    - name: Build archive
      shell: bash
      env:
        VERSION: ${{ needs.create-release.outputs.release_version }}
        TARGET: ${{ matrix.target }}
        CARGO_TARGET: ${{ matrix.cargo_targets }}
        RUNNER_OS_NAME: ${{ matrix.os }}
      run: |
        staging="$BIN_NAME-$VERSION-$TARGET"
        mkdir -p "$staging"
        if [ "$RUNNER_OS_NAME" = "windows-latest" ]; then
          cp "target/$CARGO_TARGET/release/$BIN_NAME.exe" "$staging/"
          cd "$staging"
          7z a "../$staging.zip" .
          echo "ASSET=$staging.zip" >> "$GITHUB_ENV"
        else
          cp "target/$CARGO_TARGET/release/$BIN_NAME" "$staging/"
          tar czf "$staging.tar.gz" -C "$staging" .
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
        fi
    # gh is not installed on the self-hosted runners.
    - name: Upload release archive
      if: github.event.inputs.upload_artifacts == 'true' || github.event_name == 'push'
      uses: n0-computer/actions-upload-release-asset@2613dacb5369f21a7e14f8eedce32ea9f88bb19f # main
      with:
        upload_url: ${{ github.event.inputs.upload_url || needs.create-release.outputs.upload_url }}
        asset_path: ${{ env.ASSET }}
        overwrite: true
